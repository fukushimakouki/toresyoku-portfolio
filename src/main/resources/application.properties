spring.application.name=toresyoku

# MySQL Server とデータベースの作成手順は docs/database.md を参照。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/toresyoku?connectionTimeZone=Asia/Tokyo&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:toresyoku_app}
spring.datasource.password=${DB_PASSWORD:}
# 初期テーブルのみ作成。既存テーブル・データは削除しない。
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# APIキーは secrets.properties（Git管理外）または環境変数 GEMINI_API_KEY から読む。
# ここに直接キーを書かないこと。
spring.config.import=optional:file:./secrets.properties
gemini.api-key=${GEMINI_API_KEY:}

# ---- モデル選定（2026-09-04 実測にもとづく。詳細は README「モデルが失敗する2つの理由」）----
# 本命は 3.5-flash。アプリと同じリクエストで 3/3 成功・12秒前後で最も安定している。
#
# 以前は 3.8-flash を本命にしていたが、これは取りやめた。3.8 は同じリクエストで 1/3 しか通らず、
# しかも失敗が 6〜25秒経ってから返るため、「3.8 で待たされて失敗 → 3.5 で取り直し」となり
# 提案1件に 16〜33秒かかっていた。本命を 3.5 にするだけでこの無駄が消える。
#
# 予備は 3.6-flash。無料枠の日次上限がモデルごとに独立しているため、本命と別モデルにする意味がある。
# gemini-flash-latest は 3.8-flash の別名で枠を共有するので、予備には使えない。
gemini.model=gemini-3.5-flash
# 本命が失敗したとき、固定メニューへ落ちる前に1回だけ試す予備モデル（空なら使わない）
gemini.fallback-model=gemini-3.6-flash
gemini.base-url=https://generativelanguage.googleapis.com
# true にすると API を呼ばず固定の提案を返す（キー無し・通信不良時のデモ用）
gemini.mock=false
# API が失敗したときに固定メニューへ退避する（発表当日の保険）
gemini.fallback-on-error=true
gemini.connect-timeout-seconds=10
# 発表中に無言で待たされ続けないよう、25秒で見切って固定メニューへ落とす。
# 3.6-flash には 77秒かかった実測例があり、この見切りが効く。
gemini.read-timeout-seconds=25
